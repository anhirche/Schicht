name: Save Shift Data
on:
  workflow_dispatch:
    inputs:
      payload:
        description: 'Base64-encoded data.json'
        required: true
        type: string
jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write data.json
        run: echo '${{ inputs.payload }}' | base64 -d > data.json
      - name: Commit and push
        run: |
          git config user.email "schichtplan@sync"
          git config user.name "Schichtplan Sync"
          git add data.json
          git diff --cached --quiet || git commit -m "Update shift data"
          git push
